<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUDS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="head">
        <h1>CRUDS</h1>
        <p>PRODUCt MANAGEMENT SYSTEM</p>
      </header>

      <main>
        <section class="input">
          <input type="text" name="title" id="title" placeholder="title" />
          <div class="price">
            <input type="number" name="Price" id="Price" placeholder="price" />
            <input type="number" name="taxes" id="taxes" placeholder="taxes" />
            <input type="number" name="ads" id="ads" placeholder="ads" />
            <input
              type="number"
              name="discount"
              id="discount"
              placeholder="discount"
            />
            <small id="total">Total</small>
          </div>
          <input type="number" name="count" id="count" placeholder="count" />
          <input
            type="text"
            name="category"
            id="category"
            placeholder="category"
          />
          <br />
          <button id="submit">Create</button>
        </section>

        <div class="outputs">
          <div class="searchBlock">
            <input type="text" name="Search" id="Search" placeholder="Search" />

            <div class="btnSearch">
              <button id="SearchTitle">Search By Tittle</button>
              <button id="SearchCategory">Search By categoray</button>
            </div>
          </div>
        </div>
        <table>
          <tr>
              <th>ID</th>
          <th>TITLE</th>
          <th>PRICE</th>
          <th>TAXES</th>

          <th>ADS</th>
          <th>DISCOUNT</th>
          <th>TOTAL</th>
          <th>CATEGORY</th>
          <th>UPDATE</th>
          <th>DELETE</th>
          </th>
          <tr>
            <td>1</td>
            <td>samsoung</td>
            <td>2000</td>
            <td>100</td>
            <td>100</td>
            <td>100</td>
            <td>2100</td>
            <td>phone</td>
            <td><button id="update">update</button></td>
            <td><button id="delete">delete</button></td>
          </tr>
        

        </table>
        <!-- <button>Delet All ()</button> -->
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
